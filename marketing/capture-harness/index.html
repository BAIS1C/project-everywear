      --overlay: rgba(39, 45, 60, .97);
      --border: rgba(255,255,255,.09);
      --border-strong: rgba(255,255,255,.18);
      --text: #e7edf5;
      --muted: #a6b1c2;
      --faint: #667085;
      --primary: #00c2ff;
      --primary-soft: rgba(0,194,255,.12);
      --warm: #f9b960;
      --success: #28c840;
      --warning: #ffbd2e;
      --danger: #ff5f57;
      --premium: #8b5cf6;
      --shadow: 0 28px 90px rgba(0,0,0,.44);
      --glow: 0 0 32px rgba(0,194,255,.24);
      --font-display: "Orbitron", "Segoe UI", system-ui, sans-serif;

      --radius: 12px;

    body[data-variant="ewd-clean"] {

      --sunken: #dfe8ef;
      --surface: rgba(255,255,255,.86);
      --raised: rgba(255,255,255,.94);
      --overlay: #ffffff;
      --border: rgba(28,45,64,.12);
      --border-strong: rgba(28,45,64,.24);
      --text: #121923;
      --muted: #516173;
      --faint: #7a8896;
      --primary: #0077b8;
      --primary-soft: rgba(0,119,184,.10);
      --warm: #b87516;
      --success: #168a4f;
      --warning: #b87516;
      --danger: #c24141;
      --premium: #6d5bd0;
      --shadow: 0 24px 70px rgba(23,40,62,.18);
      --glow: 0 0 0 rgba(0,0,0,0);

    body[data-variant="ewd-signal"] {

      --sunken: #030509;
      --surface: rgba(14,18,28,.9);
      --raised: rgba(24,31,48,.95);
      --overlay: rgba(31,39,58,.98);
      --border: rgba(0,194,255,.18);
      --border-strong: rgba(0,194,255,.34);
      --text: #edf8ff;
      --muted: #a9c4d8;
      --faint: #67869a;
      --primary: #00d5ff;
      --primary-soft: rgba(0,213,255,.16);
      --warm: #ffd166;
      --success: #2ee879;
      --warning: #ffd166;
      --danger: #ff5570;
      --premium: #bf7bff;
      --shadow: 0 32px 110px rgba(0,0,0,.55);

    body[data-variant="ewd-darkops"] {

      --sunken: #080706;
      --surface: #191612;
      --raised: #211d18;
      --overlay: #261f18;
      --border: rgba(226,184,104,.22);
      --border-strong: rgba(226,184,104,.42);
      --text: #eee3d1;
      --muted: #a99b85;
      --faint: #756b5c;
      --primary: #ff8a00;
      --primary-soft: rgba(255,138,0,.15);
      --warm: #d4571f;
      --success: #7fb069;
      --warning: #ffb000;
      --danger: #d4571f;
      --premium: #b7a27a;
      --shadow: 0 18px 0 rgba(0,0,0,.45);
      --glow: none;
      --font-display: "IBM Plex Mono", "Consolas", monospace;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --radius: 0;

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:

        radial-gradient(900px 600px at 8% 90%, color-mix(in srgb, var(--premium) 11%, transparent), transparent 64%),
        linear-gradient(135deg, color-mix(in srgb, var(--bg) 82%, #000), var(--bg));
      color: var(--text);
      font-family: var(--font-body);
      letter-spacing: 0;
    }
    body[data-cutout="true"] { background: transparent; }
    .stage {
      width: 3840px;
      height: 2160px;
      transform-origin: top left;
      position: relative;
      padding: 132px 168px;
    }
    .watermark {
      position: absolute;
      right: 170px;
      bottom: 80px;
      color: var(--faint);
      font: 700 22px var(--font-mono);
      letter-spacing: 8px;
      text-transform: uppercase;
      opacity: .42;
    }
    .frame {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      box-shadow: var(--shadow), var(--glow);
      overflow: hidden;
      position: relative;
    }
    body[data-variant="ewd-darkops"] .frame { border-width: 2px; }
    .titlebar {
      height: 62px;
      background: color-mix(in srgb, var(--sunken) 86%, transparent);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      font: 800 20px var(--font-display);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .window-controls { display: flex; gap: 11px; align-items: center; }
    .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--faint); }
    body[data-variant="ewd-darkops"] .dot { border-radius: 0; }
    .dot.red { background: var(--danger); }
    .dot.yellow { background: var(--warning); }
    .dot.green { background: var(--success); }
    .shell { display: grid; grid-template-columns: 360px 1fr; height: calc(100% - 62px); }
    .sidebar {
      background: color-mix(in srgb, var(--sunken) 86%, transparent);
      border-right: 1px solid var(--border);
      padding: 30px 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .profile-card { padding: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .avatar {
      width: 72px; height: 72px; display: grid; place-items: center;
      background: var(--primary-soft); border: 1px solid var(--border-strong);
      border-radius: var(--radius); color: var(--primary); font: 900 24px var(--font-display);
    }
    .profile-name { margin-top: 14px; font: 800 24px var(--font-display); }
    .profile-mail { margin-top: 4px; color: var(--muted); font: 600 17px var(--font-mono); }
    .tier { display: inline-block; margin-top: 12px; padding: 6px 12px; border: 1px solid var(--border-strong); color: var(--primary); background: var(--primary-soft); border-radius: 999px; font: 800 15px var(--font-mono); text-transform: uppercase; }
    body[data-variant="ewd-darkops"] .tier { border-radius: 0; }
    .nav { display: grid; gap: 8px; }
    .nav-title { margin: 10px 8px 0; font: 800 13px var(--font-mono); color: var(--faint); text-transform: uppercase; letter-spacing: 4px; }
    .nav-item {
      min-height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
      border-radius: var(--radius); color: var(--muted); font: 700 19px var(--font-body);
    }
    .nav-item.active { background: var(--primary-soft); color: var(--text); border: 1px solid var(--border-strong); }
    .nav-icon { width: 28px; color: var(--primary); text-align: center; font: 900 16px var(--font-mono); }
    .side-footer { margin-top: auto; border-top: 1px solid var(--border); padding-top: 18px; color: var(--muted); font: 600 16px var(--font-mono); line-height: 1.6; }
    .main { padding: 44px 54px; overflow: hidden; position: relative; }
    h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: 1px; }
    h1 { font-size: 56px; line-height: 1; }
    h2 { font-size: 38px; }
    h3 { font-size: 26px; }
    p { margin: 0; }
    .subtitle { margin-top: 14px; color: var(--muted); font-size: 24px; line-height: 1.35; max-width: 1080px; }
    .grid { display: grid; gap: 24px; }
    .cards { grid-template-columns: repeat(4, minmax(0,1fr)); margin-top: 42px; }
    .card {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: 0 16px 42px rgba(0,0,0,.12);
      position: relative;
      overflow: hidden;
    }
    .card.feature::after {
      content: "";
      position: absolute; inset: 0 0 auto 0; height: 4px;
      background: linear-gradient(90deg, var(--primary), transparent);
    }
    .card.locked { opacity: .62; }
    .glyph {
      width: 76px; height: 76px; display: grid; place-items: center;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      background: var(--primary-soft); color: var(--primary);
      font: 900 25px var(--font-display);
    }
    .card-title { margin-top: 20px; font: 900 28px var(--font-display); }
    .card-copy { margin-top: 12px; color: var(--muted); font-size: 20px; line-height: 1.35; min-height: 82px; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .tag { padding: 5px 9px; border: 1px solid var(--border); color: var(--muted); font: 800 13px var(--font-mono); text-transform: uppercase; border-radius: 999px; }
    body[data-variant="ewd-darkops"] .tag { border-radius: 0; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid var(--border-strong); background: var(--primary-soft); color: var(--primary); border-radius: 999px; font: 900 14px var(--font-mono); text-transform: uppercase; letter-spacing: 1px; }
    body[data-variant="ewd-darkops"] .pill { border-radius: 0; }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
    }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .three { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .label { color: var(--faint); font: 800 15px var(--font-mono); text-transform: uppercase; letter-spacing: 2px; }
    .value { color: var(--text); font: 700 22px var(--font-body); }
    .input, .textarea, .select {
      width: 100%; background: color-mix(in srgb, var(--sunken) 70%, transparent);
      color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; font: 600 22px var(--font-body); outline: none;
    }
    .textarea { min-height: 170px; resize: none; line-height: 1.36; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 58px; padding: 0 26px; border: 1px solid var(--border-strong);
      border-radius: var(--radius); background: var(--raised); color: var(--text);
      font: 900 16px var(--font-mono); text-transform: uppercase; letter-spacing: 1px;
    }
    .btn.primary { background: var(--primary); color: color-mix(in srgb, var(--bg) 90%, #000); border: 0; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .progress { height: 14px; border: 1px solid var(--border); background: var(--sunken); border-radius: 999px; overflow: hidden; }
    body[data-variant="ewd-darkops"] .progress { border-radius: 0; }
    .bar { height: 100%; width: var(--w, 50%); background: linear-gradient(90deg, var(--primary), var(--warm)); box-shadow: var(--glow); }
    .metric { font: 900 48px var(--font-display); color: var(--primary); }
    .mini { color: var(--muted); font: 700 17px var(--font-mono); }
    .table { display: grid; gap: 10px; }
    .table-row { display: grid; grid-template-columns: 1.4fr .8fr .7fr .6fr .6fr; gap: 18px; align-items: center; min-height: 72px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in srgb, var(--raised) 70%, transparent); }
    .thumb { width: 52px; height: 52px; border-radius: 8px; background: linear-gradient(135deg, var(--primary-soft), color-mix(in srgb, var(--premium) 22%, transparent)); border: 1px solid var(--border); }
    body[data-variant="ewd-darkops"] .thumb { border-radius: 0; }
    .modal-overlay { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(8px); }
    .modal { width: 780px; background: var(--overlay); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; }
    .login-wrap { height: 100%; display: grid; place-items: center; }

    .login-title { font: 900 54px var(--font-display); }
    .login-sub { margin-top: 12px; color: var(--muted); font-size: 25px; }
    .field { display: grid; gap: 10px; margin-top: 24px; }
    .field label { color: var(--muted); font: 800 15px var(--font-mono); text-transform: uppercase; letter-spacing: 2px; }
    .auth-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
    .spinner { width: 82px; height: 82px; border: 7px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 26px; }
    body[data-variant="ewd-darkops"] .spinner { border-radius: 0; }
    .app-viewport { height: 100%; display: grid; grid-template-rows: 56px 1fr; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--sunken); }
    .app-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: var(--surface); border-bottom: 1px solid var(--border); font: 900 17px var(--font-mono); text-transform: uppercase; letter-spacing: 2px; }
    .pane-grid { height: 100%; display: grid; grid-template-columns: 360px 1fr 380px; }
    .pane { padding: 24px; border-right: 1px solid var(--border); overflow: hidden; }
    .pane:last-child { border-right: 0; }
    .chat { display: grid; grid-template-rows: 1fr 188px; height: 100%; }
    .chat-scroll { padding: 24px; display: grid; align-content: end; gap: 20px; }
    .msg { display: grid; grid-template-columns: 58px 1fr; gap: 16px; align-items: start; }
    .msg-avatar { width: 58px; height: 58px; display: grid; place-items: center; background: var(--primary-soft); border: 1px solid var(--border); color: var(--primary); border-radius: var(--radius); font: 900 15px var(--font-mono); }
    .msg-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; font-size: 22px; line-height: 1.38; }
    .composer { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface); }
    .wave { height: 132px; display: grid; grid-template-columns: repeat(56,1fr); gap: 5px; align-items: center; }
    .wave span { display: block; height: calc(18px + var(--h) * 1px); background: linear-gradient(180deg, var(--primary), var(--warm)); border-radius: 999px; opacity: .86; }
    body[data-variant="ewd-darkops"] .wave span { border-radius: 0; }
    .timeline { display: grid; grid-template-columns: repeat(9,1fr); gap: 10px; height: 110px; }
    .clip { border: 1px solid var(--border); border-radius: var(--radius); background: var(--primary-soft); }
    .preview {
      border: 1px solid var(--border); border-radius: var(--radius); background:
        linear-gradient(135deg, color-mix(in srgb, var(--primary) 22%, transparent), transparent 36%),
        linear-gradient(315deg, color-mix(in srgb, var(--premium) 22%, transparent), transparent 40%),

    .hero-image {
      width: 100%; aspect-ratio: 16/9; border: 1px solid var(--border); border-radius: var(--radius);

    .status-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: var(--success); box-shadow: 0 0 18px currentColor; color: var(--success); }
    body[data-variant="ewd-darkops"] .status-dot { border-radius: 0; }
    .status-dot.off { background: var(--danger); color: var(--danger); }
    .status-dot.warn { background: var(--warning); color: var(--warning); }
    .empty-center { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .empty-mark { width: 116px; height: 116px; display: grid; place-items: center; border: 1px solid var(--border-strong); background: var(--primary-soft); color: var(--primary); border-radius: var(--radius); margin: 0 auto 22px; font: 900 42px var(--font-display); }
    .skeleton { background: linear-gradient(90deg, color-mix(in srgb, var(--raised) 70%, transparent), color-mix(in srgb, var(--primary) 10%, transparent), color-mix(in srgb, var(--raised) 70%, transparent)); border-radius: var(--radius); min-height: 28px; }
  </style>
</head>

        case "bug-report-modal": return shell("Logs", `<h1>Diagnostics</h1><p class="subtitle">Structured report capture with selectable log categories.</p><div class="modal-overlay"><div class="modal"><h2>Report a Problem</h2><div class="field"><label>What went wrong?</label><textarea class="textarea">Video encoder fell back during 3nvizen export while Gener8 was holding the shared encoder sidecar.</textarea></div><div class="split"><div>${["System","Applet","Generation","Model","Sidecar","Vault","IPC"].map((n,i)=>`<div class="row" style="margin-top:12px"><span>${n}</span><span class="tag">${[9,14,28,6,4,12,3][i]} entries</span></div>`).join("")}</div><div><div class="field"><label>Send to</label><span class="pill">Everywear Team</span><span class="pill" style="margin-left:8px">Local Kasai</span></div><p class="mini">Estimated size: 48KB<br>Session: ew-20260518-2041</p></div></div><div class="row" style="margin-top:24px"><button class="btn">Copy to Clipboard</button><button class="btn primary">Send Report</button></div></div></div>`);
        case "vault-list": return shell("Vault", `<div class="row"><div><h1>Everywear Vault</h1><p class="subtitle">Generated content across Everywear applets, indexed locally.</p></div><span class="pill">142 items - 418GB</span></div><div class="row" style="margin-top:26px"><div>${["All","Images","Audio","Videos","Stems","Favorites"].map((t,i)=>`<span class="${i===0?'pill':'tag'}">${t}</span>`).join(" ")}</div><input class="input" value="Kasai" style="width:440px"></div><div style="margin-top:24px">${tableRows()}</div>`);
        case "vault-detail": return shell("Vault", `<button class="btn ghost">Back</button><div class="split" style="margin-top:24px"><div class="section"><div class="hero-image"></div></div><div class="section"><h1>Neon rain portrait - Kasai study</h1><p class="subtitle">Created by 1magen. Prompt, seed, dimensions, and vault tags stay local.</p><div class="row" style="margin-top:24px"><span class="label">Media</span><span class="pill">image</span></div><div class="row" style="margin-top:18px"><span class="label">File</span><span class="value">24.8 MB</span></div><div class="row" style="margin-top:18px"><span class="label">Prompt</span><span class="value" style="font-size:20px">Cinematic editorial portrait of Kasai...</span></div>${tagList(["1magen","portrait","marketing","favorite"])}</div></div>`);
        case "vault-empty": return shell("Vault", `<div class="empty-center"><div><div class="empty-mark">VA</div><h1>No results</h1><p class="subtitle">No items match "cloud render". Try a different search or save generated work from any applet.</p></div></div>`);
        case "vault-loading": return shell("Vault", `<h1>Everywear Vault</h1><div class="grid" style="margin-top:38px">${Array.from({length:7},()=>`<div class="section"><div class="row"><div class="skeleton" style="width:70px;height:70px"></div><div style="flex:1"><div class="skeleton" style="width:42%"></div><div class="skeleton" style="width:28%;margin-top:14px"></div></div><div class="skeleton" style="width:150px"></div></div></div>`).join("")}</div>`);
        case "applet-loading": return shell("Applets", appFrame("Kasai", `<div class="empty-center"><div style="width:70%"><div class="skeleton" style="height:64px;width:38%;margin:0 auto 36px"></div><div class="three">${Array.from({length:3},()=>'<div class="section"><div class="skeleton" style="height:240px"></div><div class="skeleton" style="margin-top:20px"></div></div>').join("")}</div><p class="subtitle">Loading applet component and provisioning its runtime bridge...</p></div></div>`));
        case "applet-error": return shell("Applets", appFrame("3nvizen", `<div class="empty-center"><div><div class="empty-mark">!</div><h1>3nvizen failed to load</h1><p class="subtitle">Sidecar manifest missing required launch URL. Retry after provisioning.</p><button class="btn primary" style="margin-top:24px">Retry</button></div></div>`));
        case "kasai-empty": return kasai("empty");
        case "kasai-chat-tools": return kasai("chat");
        case "kasai-skill": return kasai("skill");
        case "runtime-orchestration": return shell("Hardware", `<h1>Runtime Orchestration</h1><p class="subtitle">Shared VRAM arbitration, task shards, and multi-tool coordination across applets.</p><div class="three" style="margin-top:32px"><div class="section"><div class="label">Active Applets</div><div class="metric">4</div><p class="mini">1magen, Kasai, Gener8, Vid</p></div><div class="section"><div class="label">VRAM Ceiling</div><div class="metric">90%</div><div class="progress"><div class="bar" style="--w:74%"></div></div></div><div class="section"><div class="label">Task Shards</div><div class="metric">12</div><p class="mini">3 running - 9 queued</p></div></div><div class="split" style="margin-top:28px"><div class="section"><h2>Model Slots</h2>${["Primary LLM - Qwen3.6 35B","Image Diffusion - Z-Image Turbo","Audio - ACE-Step v1.5","Video - LTX 2.3 adapter"].map((n,i)=>`<div class="row" style="margin-top:18px"><span>${n}</span><span class="pill">${i<2?"resident":"warm"}</span></div>`).join("")}</div><div class="section"><h2>Agent Plan</h2>${["Recall prior launch constraints","Generate image hero variants","Export trailer visualizer","Index outputs in vault"].map((n,i)=>`<div class="row" style="margin-top:18px"><span>${n}</span><span class="tag">${i<2?"done":"running"}</span></div>`).join("")}</div></div>`);
        case "imagen-empty": return imagen("empty");
        case "imagen-generating": return imagen("generating");
        case "imagen-result": return imagen("result");
        case "threevizen-idle": return threevizen("idle");
        case "threevizen-generating": return threevizen("generating");
        case "threevizen-result": return threevizen("result");
        case "gener8-create": return gener8("create");
        case "gener8-progress": return gener8("progress");
        case "gener8-library": return gener8("library");
        case "gener8-settings": return gener8("settings");
        case "vid-studio": return vid("base");
        case "vid-export-modal": return vid("modal");
        case "character-studio": return shell("Character Studio", appFrame("Character Studio", `<div class="split" style="height:100%;padding:32px"><div class="preview"><div><div class="empty-mark">CS</div><h1>Character Studio</h1><p class="subtitle">VRM character staging, expression sheets, voice references, and shot continuity.</p></div></div><div class="section"><h2>Rig Controls</h2>${["Expression: focused smile","Pose: presentation stance","Camera: 85mm portrait","Lighting: soft cyan key"].map(n=>`<div class="row" style="margin-top:18px"><span>${n}</span><span class="pill">ready</span></div>`).join("")}</div></div>`));
        case "installer-models": return shell("Settings", `<h1>Install Local Stack</h1><p class="subtitle">One-click model provisioning with SHA256 verification, cache discovery, and licence-aware options.</p><div class="split" style="margin-top:32px"><div class="section"><h2>Recommended Downloads</h2>${["z-image-turbo-q4 - 8.6GB","Qwen3.6 35B-A3B Q4 - 20.5GB","ACE-Step v1.5 - 5.8GB","LTX 2.3 distilled - 43GB"].map((n,i)=>`<div class="row" style="margin-top:18px"><span>${n}</span><span class="${i===0?'pill':'tag'}">${i===0?'downloading 68%':'queued'}</span></div>`).join("")}<div class="progress" style="margin-top:24px"><div class="bar" style="--w:68%"></div></div></div><div class="section"><h2>Discovery</h2><p class="subtitle" style="font-size:21px">Scanned LM Studio, Ollama, HuggingFace Hub, GPT4All, and Everywear model cache before downloading.</p><button class="btn primary" style="margin-top:22px">Continue Setup</button></div></div>`);
        case "file-browser": return shell("Vault", `<h1>Project Files</h1><p class="subtitle">Local file browser for source images, reference audio, project folders, and vault-backed outputs.</p><div class="split" style="margin-top:30px"><div class="section"><h2>C:\\Users\\MAG MSI\\Projects\\Trailer Pack</h2>${["reference_track.wav","kasai_portrait_source.png","shotlist_lombok_market.md","export_steam_4k.mp4","voiceover_en_lrc.lrc"].map((n,i)=>`<div class="table-row" style="grid-template-columns:.2fr 1.6fr .5fr .5fr"><span class="thumb"></span><span class="value" style="font-size:22px">${n}</span><span class="tag">${["audio","image","doc","video","lyrics"][i]}</span><button class="btn ghost" style="min-height:38px">Select</button></div>`).join("")}</div><div class="section"><h2>Selection</h2><p class="subtitle" style="font-size:21px">reference_track.wav<br>Used as style reference for Gener8 and beat source for Vid Studio.</p><button class="btn primary" style="margin-top:22px">Attach to Workflow</button></div></div>`);
        case "update-flow": return shell("Settings", `<h1>Update Available</h1><p class="subtitle">Everywear can stage shell updates, verify applet compatibility, and preserve local caches.</p><div class="section" style="margin-top:32px"><div class="row"><div><h2>Everywear OS 0.1.1</h2><p class="subtitle" style="font-size:21px">Runtime bridge reliability, vault thumbnails, and 3nvizen health recovery.</p></div><span class="pill">Ready to install</span></div><div class="progress" style="margin-top:24px"><div class="bar" style="--w:100%"></div></div><div class="three" style="margin-top:24px"><div class="section"><div class="label">Verified</div><div class="metric">12</div><p class="mini">package checks</p></div><div class="section"><div class="label">Cache impact</div><div class="metric">0GB</div><p class="mini">models preserved</p></div><div class="section"><div class="label">Restart</div><div class="metric">1</div><p class="mini">required</p></div></div><button class="btn primary" style="margin-top:24px">Install Update</button></div>`);
        default: return launcher(false);
      }
    }

    function render() {
      const variant = q("variant", "ewd-clean");
      const scene = q("scene", "shell-launcher");
      const cutout = q("cutout", "false") === "true";
      document.body.dataset.variant = variant;
      document.body.dataset.cutout = String(cutout);
      const root = document.getElementById("root");
      root.innerHTML = `<div class="stage">${surface(scene)}<div class="watermark">${variants[variant] || variant} / ${scene}</div></div>`;
      const scale = Math.min(innerWidth / 3840, innerHeight / 2160);
      document.querySelector(".stage").style.transform = `scale(${scale})`;
    }
    addEventListener("resize", render);
    render();
  </script>
</body>
</html>
