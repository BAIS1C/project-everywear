[package]
name = "everywear-os"
version = "0.1.0"
edition = "2021"
description = "Everywear OS: AI platform shell with GPU management, identity, and applet launcher"
authors = ["Sean Uddin <somo@metafintek.xyz>"]
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "everywear_os_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

# --- GPU detection ---
nvml-wrapper = "0.10"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- HTTP ---
reqwest = { version = "0.12", features = ["stream", "json"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- Security / crypto ---
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"

# --- Storage ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Workspace crates ---
applet-ipc = { path = "../../../crates/applet-ipc", features = ["hmac"] }
model-manager = { path = "../../../crates/model-manager" }
everywear-paths = { path = "../../../crates/everywear-paths" }

# --- Utilities ---
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
open = "5"
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
