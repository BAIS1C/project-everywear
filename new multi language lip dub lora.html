-><div><yt-attributed-string></yt-attributed-string><yt-formatted-string></yt-formatted-string></div><div><span><span></span><yt-attributed-string><span><span>Lightricks just released LipDub for LTX 2.3, and it\'s a game-changer for multi-language content. In this video, I walk you through the complete ComfyUI workflow — from loading the IC-LoRA to generating lip-synced videos in French, Spanish, Korean, and German.\n\nKey Takeaways:\nLipDub doesn\'t just swap audio — it regenerates the lip movements and facial expressions to naturally match the target language. This is fundamentally different from traditional dubbing that just masks the mouth area.\n\nThe results are remarkably natural, especially with steady camera shots. For best results, use the 2x Better Upscale and experiment with the high-resolution sampling group.\n\nWhat You\'ll Learn:\n• How to use LTX 2.3 LipDub IC-LoRA in ComfyUI\n• The LTX Set Audio Reference Tokens node explained\n• Two-stage distillation workflow for better quality\n• How to extract transcripts with Whisper ASR\n• Adding emotional expressions (laughing) to dubbed videos\n• Multi-character and multi-camera dubbing techniques\n• Portrait vs landscape video handling\n\nTimeline : \n</span><span><a href="/watch?v=pF9wv-yqnhI">0:00</a></span><span> - Introduction to LTX Video 0.9 and the Lipdub LoRA\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=31s">0:31</a></span><span> - Why Lipdub is useful for creators (Multilingual Content)\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=66s">1:06</a></span><span> - Example 1: English vs. French comparison\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=123s">2:03</a></span><span> - Deep dive into the ComfyUI workflow and custom nodes\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=196s">3:16</a></span><span> - Tutorial: Setting up the video reference and audio encoding\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=251s">4:11</a></span><span> - Workflow configuration: Dimensions and samp   pageContent: "<video_metadata>\nType: YouTube Video\nTitle: LTX 2.3 Just Changed AI Dubbing Forever — LipDub IC-LoRA ComfyUI Walkthrough\nDescription: Lightricks just released LipDub for LTX 2.3, and it's a game-changer for multi-language content. In this video, I walk you through the complete ComfyUI workflow — from loading the IC-LoRA to generating lip-synced videos in French, Spanish, Korean, and German.\n\nKey Takeaways:\nLipDub doesn't just swap audio — it regenerates the lip movements and facial expressions to naturally match the target language. This is fundamentally different from traditional dubbing that just masks the mouth area.\n\nThe results are remarkably natural, especially with steady camera shots. For best results, use the 2x Better Upscale and experiment with the high-resolution sampling group.\n\nWhat You'll Learn:\n• How to use LTX 2.3 LipDub IC-LoRA in ComfyUI\n• The LTX Set Audio Reference Tokens node explained\n• Two-stage distillation workflow for better quality\n• How to extract transcripts with Whisper ASR\n• Adding emotional expressions (laughing) to dubbed videos\n• Multi-character and multi-camera dubbing techniques\n• Portrait vs landscape video handling\n\nTimeline : \n0:00 - Introduction to LTX Video 0.9 and the Lipdub LoRA\n0:31 - Why Lipdub is useful for creators (Multilingual Content)\n1:06 - Example 1: English vs. French comparison\n2:03 - Deep dive into the ComfyUI workflow and custom nodes\n3:16 - Tutorial: Setting up the video reference and audio encoding\n4:11 - Workflow configuration: Dimensions and sampling steps\n5:27 - Text prompts and language formatting\n6:00 - Using ASR (Whisper) for transcripts and translation\n7:03 - Result: French Dub with emotional/laughing sounds\n8:13 - Example 2: Multi-character and multi-shot Spanish dub\n9:37 - Example 3: Steady camera Korean dub comparison\n11:15 - Example 4: German dub and pronunciation matching\n12:12 - Final thoughts on internationalizing AI content\n\nModel & Resources:\n• Lightricks LTX GitHub: https://github.com/Lightricks/LTX-Video\n• ComfyUI: https://github.com/comfyanonymous/ComfyUI\n• Whisper ASR: https://github.com/openai/whisper\n• LTX 2.3 IC-LoRA LipDub: https://huggingface.co/Lightricks/LTX-2.3-22b-IC-LoRA-LipDub\n• ComfyUI LTX Video Nodes: (update your custom nodes to get the LipDub support)\n• Workflow : https://github.com/Lightricks/ComfyUI-LTXVideo/blob/master/example_workflows/2.3/LTX-2.3_ICLoRA_HDR_Distilled.json\n\nLocal Workstation GPU : https://amzn.to/3XfXsAO\n--------------------------------------------------------------------------------------------------------------------------------\n\nIf You Like tutorial like this, You Can Support Our Work In Patreon:\nhttps://www.patreon.com/c/aifuturetech\n\n#LTX #LipDub #AIDubbing #ComfyUI #Lightricks #VideoAI\nThumbanil URL: https://i.ytimg.com/vi/pF9wv-yqnhI/maxresdefault.jpg\nDuration: 762 seconds\nViews: 4763\nDate Published: May 13, 2026\nChannel: Benji’s AI Playground <http://www.youtube.com/@BenjisAIPlayground> (31200 subscribers)\n</video_metadata>\n\n<video_captions>\n[00:00] All right, let's talk about LTX,\n\n[00:02] Lightricks.\n\n[00:03] They have released this 2.3 model and\n\n[00:06] since then a lot of IC Lore and ID Lore.\n\n[00:10] Lots of these add-on technologies that\n\n[00:11] are capable of unleashing these AI\n\n[00:13] models, making them better, more\n\n[00:15] flexible to scale up with different\n\n[00:17] features on top of their base model.\n\n[00:20] Now they have a lot of Lores published\n\n[00:22] officially by them as well as by the\n\n[00:24] community that have trained the IC Lore.\n\n[00:27] We have covered some of that previously\n\n[00:29] and today I want to talk about this one\n\n[00:30] called the Lip Dub because this is\n\n[00:32] really useful for creating content and\n\n[00:34] having characters talking, speaking with\n\n[00:36] different languages. Let me show you\n\n[00:38] guys what I have been practicing lately.\n\n[00:41] >> [music]\n\n[00:46] [music]\n\n[00:49] >> As we all know, it's not only English\n\n[00:51] audience here. Even in video content,\n\n[00:53] you will have different audiences and\n\n[00:55] the Lip Dub is going to help you use the\n\n[00:57] same character having the same motions,\n\n[00:59] everything, the video footage, but the\n\n[01:02] only thing changing is the sound and\n\n[01:04] also the lip movement. So for example,\n\n[01:07] it's like this one that I did previously\n\n[01:08] using LTX. It is speaking in English.\n\n[01:12] This initiative cannot wait any longer.\n\n[01:15] We must act now.\n\n[01:30] The difference between this and after\n\n[01:32] using Lip Dub. Well, yes. Just by then I\n\n[01:35] translate this to French and all the\n\n[01:37] movements are the same character.\n\n[01:39] Nothing changed from the backgrounds and\n\n[01:40] the characters. Everything stays\n\n[01:42] consistent. The only thing that changed\n\n[01:45] is the lip syncing. How it's expressing\n\n[01:48] the facial expressions of the lower part\n\n[01:50] of the face, especially to match with\n\n[01:52] the language that it's going to speak.\n\n[01:54] That is a really natural different way\n\n[01:56] of lip syncing, rather than you just\n\n[01:58] masking the mouth area and trying to\n\n[02:00] make the lips move with another\n\n[02:02] language.\n\n[02:03] So, we are going to play around with\n\n[02:05] Light Rix, especially since they have\n\n[02:07] the ComfyUI LTX video. There is an\n\n[02:11] updated custom node, as well as the\n\n[02:13] example workflow for the lip dub. So,\n\n[02:15] dubbing is not a new technique, but then\n\n[02:17] by using it in an innovative way, a more\n\n[02:20] useful way, dubbing with other languages\n\n[02:22] is really powerful stuff. Really good\n\n[02:25] tools that a lot of applications can use\n\n[02:27] daily. So, we are going to check out\n\n[02:29] this workflow, lip dub two-stage\n\n[02:31] distillations. So, after you update .base.styles.css.js--><div><yt-attributed-string></yt-attributed-string><yt-formatted-string></yt-formatted-string></div><div><span><span></span><yt-attributed-string><span><span>Lightricks just released LipDub for LTX 2.3, and it\'s a game-changer for multi-language content. In this video, I walk you through the complete ComfyUI workflow — from loading the IC-LoRA to generating lip-synced videos in French, Spanish, Korean, and German.\n\nKey Takeaways:\nLipDub doesn\'t just swap audio — it regenerates the lip movements and facial expressions to naturally match the target language. This is fundamentally different from traditional dubbing that just masks the mouth area.\n\nThe results are remarkably natural, especially with steady camera shots. For best results, use the 2x Better Upscale and experiment with the high-resolution sampling group.\n\nWhat You\'ll Learn:\n• How to use LTX 2.3 LipDub IC-LoRA in ComfyUI\n• The LTX Set Audio Reference Tokens node explained\n• Two-stage distillation workflow for better quality\n• How to extract transcripts with Whisper ASR\n• Adding emotional expressions (laughing) to dubbed videos\n• Multi-character and multi-camera dubbing techniques\n• Portrait vs landscape video handling\n\nTimeline : \n</span><span><a href="/watch?v=pF9wv-yqnhI">0:00</a></span><span> - Introduction to LTX Video 0.9 and the Lipdub LoRA\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=31s">0:31</a></span><span> - Why Lipdub is useful for creators (Multilingual Content)\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=66s">1:06</a></span><span> - Example 1: English vs. French comparison\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=123s">2:03</a></span><span> - Deep dive into the ComfyUI workflow and custom nodes\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=196s">3:16</a></span><span> - Tutorial: Setting up the video reference and audio encoding\n</span><span><a href="/watch?v=pF9wv-yqnhI&amp;t=251s">4:11</a></span><span> - Workflow configuration:   '$launchVariables->pageContent': "<video_metadata>\nType: YouTube Video\nTitle: LTX 2.3 Just Changed AI Dubbing Forever — LipDub IC-LoRA ComfyUI Walkthrough\nDescription: Lightricks just released LipDub for LTX 2.3, and it's a game-changer for multi-language content. In this video, I walk you through the complete ComfyUI workflow — from loading the IC-LoRA to generating lip-synced videos in French, Spanish, Korean, and German.\n\nKey Takeaways:\nLipDub doesn't just swap audio — it regenerates the lip movements and facial expressions to naturally match the target language. This is fundamentally different from traditional dubbing that just masks the mouth area.\n\nThe results are remarkably natural, especially with steady camera shots. For best results, use the 2x Better Upscale and experiment with the high-resolution sampling group.\n\nWhat You'll Learn:\n• How to use LTX 2.3 LipDub IC-LoRA in ComfyUI\n• The LTX Set Audio Reference Tokens node explained\n• Two-stage distillation workflow for better quality\n• How to extract transcripts with Whisper ASR\n• Adding emotional expressions (laughing) to dubbed videos\n• Multi-character and multi-camera dubbing techniques\n• Portrait vs landscape video handling\n\nTimeline : \n0:00 - Introduction to LTX Video 0.9 and the Lipdub LoRA\n0:31 - Why Lipdub is useful for creators (Multilingual Content)\n1:06 - Example 1: English vs. French comparison\n2:03 - Deep dive into the ComfyUI workflow and custom nodes\n3:16 - Tutorial: Setting up the video reference and audio encoding\n4:11 - Workflow configuration: Dimensions and sampling steps\n5:27 - Text prompts and language formatting\n6:00 - Using ASR (Whisper) for transcripts and translation\n7:03 - Result: French Dub with emotional/laughing sounds\n8:13 - Example 2: Multi-character and multi-shot Spanish dub\n9:37 - Example 3: Steady camera Korean dub comparison\n11:15 - Example 4: German dub and pronunciation matching\n12:12 - Final thoughts on internationalizing AI content\n\
