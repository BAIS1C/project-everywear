<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1magen</title>
  <script>
    // Pre-paint: apply skin before React hydrates to avoid FOUC.
    (function() {
      var skin = 'classic', mode = 'dark';
      try { skin = localStorage.getItem('ew-skin') || 'classic'; } catch(e){}
      document.body.dataset.skin = skin;
      document.body.dataset.mode = mode;
      document.body.classList.add('ew');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
