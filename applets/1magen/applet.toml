# 1magen Applet Manifest
# Read by the Everywear OS shell to gate, provision, and launch this applet.
# See WIKI.md Section 6 "Applet Manifest Schema" for the full spec.

[applet]
id = "1magen"
name = "1magen"
version = "0.1.0"
description = "Local AI image generation and editing"
icon = "icons/1magen.png"
transport = "tauri"

[engine]
type = "diffusion"
backend = "ffi"
server_binary = ""

[entitlements.launch]
min_tier = "gener8"
enforced_by = ["everywear_shell", "1magen_runtime"]
features = ["1magen", "1magen.image"]

# Model groups: ordered by preference (first viable group wins).
# Shell walks groups top-down, picks the first where ALL required
# models fit within the VRAM budget.

[[model_groups]]
label = "High Quality"
min_vram_mb = 10240

  [[model_groups.models]]
  key = "z-image-turbo-q8"
  role = "Primary"
  required = true
  vram_mb = 7200
  filename = "z_image_turbo-Q8_0.gguf"
