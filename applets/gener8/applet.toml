[upgrade_packs.creator_studio_bundle]
label = "Creator Studio Bundle"
min_tier = "creator_studio"
description = "Adds AI Director orchestration LLM, Wan 2.2 I2V video generation, stem separator, cover art generation, and Style Forge (music LoRA training). 16 GB VRAM hard floor."
inherits = ["better_models"]
unlocks = ["ai_director", "stem_separation", "style_training", "local_video", "cover_art", "repaint", "extract", "lego", "complete"]
status = "placeholder"
# Models TBD: AI Director LLM (Qwen2.5-7B or Llama-3.2-3B Q4_K_M),
# Wan 2.2 I2V distilled (high_noise + low_noise expert pair),
# UMT5-XXL text encoder, Wan 2.2 VAE, Qwen-Image for cover art.
# Pinned filenames and sizes to be added when creator studio ships.

[requirements]
cuda_compute = "7.0"
