# ── Upgrade packs (licence-gated, NOT part of base install) ─────────
# Provisioned by the shell after base model_groups when the user's
# licence tier entitles them. VRAM-gated quant selection uses the
# same logic as model_groups (highest quant that fits).

[upgrade_packs.better_models]
label = "Better Models (Pro)"
min_tier = "gener8_pro"
description = "Adds xl-base (sftturbo50 distillation) DiT for full-quality cover song, reference audio, and advanced task types. HF files named sftturbo50; renamed to xl-base on disk for ace-server compatibility."
unlocks = ["cover_full_quality", "reference_full_quality"]
status = "active"

  # VRAM-gated quant ladder: shell picks the highest that fits.
  # hf_file != filename: mandatory sftturbo50 -> xl-base rename.
  [[upgrade_packs.better_models.quants]]
  quant = "Q4_K_M"
  min_vram_mb = 6144
  key = "acestep-base-q4km"
  role = "Primary"
  filename = "acestep-v15-xl-base-Q4_K_M.gguf"
  hf_repo = "Serveurperso/ACE-Step-1.5-GGUF"
  hf_file = "acestep-v15-xl-sftturbo50-Q4_K_M.gguf"
  size_bytes = 2_990_000_000

  [[upgrade_packs.better_models.quants]]
  quant = "Q5_K_M"
  min_vram_mb = 8192
  key = "acestep-base-q5km"
  role = "Primary"
  filename = "acestep-v15-xl-base-Q5_K_M.gguf"
