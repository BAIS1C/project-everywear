# Gener8 Applet Manifest
# Read by the Everywear OS shell to gate, provision, and launch this applet.
# Engine: ACE-Step 1.5 GGUF inference server (sidecar on :8080)
# HF repo: Serveurperso/ACE-Step-1.5-GGUF
#
# IMPORTANT: model_groups declare the BASE INSTALL (Gener8 tier).
# Base tier ships xl-turbo (8-step fast generation DiT).
# Pro tier adds xl-base (sftturbo50 distillation, renamed to xl-base on disk)
# via the upgrade_packs system, NOT through model_groups.
# Creator Studio inherits Pro + adds creator_studio_bundle.
# See WIKI.md "ACE-Step GGUF Naming Convention" for the rename convention.

[applet]
id = "gener8"
name = "Gener8"
version = "0.1.0"
description = "AI music generation, stem mixing, and production powered by ACE-Step"
icon = "gener8"
transport = "ipc"

[engine]
type = "audio"
backend = "server"
server_binary = "ace-server"

# ── Base install model groups ────────────────────────────────────────
# Shell walks groups top-down, picks the first where ALL required
# models fit within the VRAM budget.
#
# ACE-Step needs 4 models: DiT (generation), LM (language model),
# VAE (audio decode), Text Encoder (prompt encoding).
# DiT has a quant ladder (xl-turbo variants); the other 3 are fixed.
#
# xl-turbo is the base-tier DiT: 8-step fast generation, covers
# text2music natively. Cover/reference available but quality-limited
# (turbo distillation). Pro upgrade adds xl-base (sftturbo50) for
# full-quality cover/reference/extract/lego/complete.

[[model_groups]]
label = "Turbo Q8_0 (16 GB+)"
min_vram_mb = 16384

  [[model_groups.models]]
  key = "acestep-turbo-q8"
  role = "Primary"
  required = true
  vram_mb = 8192
  filename = "acestep-v15-xl-turbo-Q8_0.gguf"
  hf_repo = "Serveurperso/ACE-Step-1.5-GGUF"
  hf_file = "acestep-v15-xl-turbo-Q8_0.gguf"
  size_bytes = 5_000_000_000

  [[model_groups.models]]
  key = "acestep-lm"
  role = "Encoder"
  required = true
  vram_mb = 1024
  filename = "acestep-5Hz-lm-0.6B-Q8_0.gguf"
  hf_repo = "Serveurperso/ACE-Step-1.5-GGUF"
