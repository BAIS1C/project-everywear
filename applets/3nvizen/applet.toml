# 3nvizen Applet Manifest
# Provisional local-video contract for Everywear OS.
# This applet is server-backed because the current preferred local path is
# the official LTX Python runtime wrapped in a managed sidecar.

[applet]
id = "3nvizen"
name = "3nvizen"
version = "0.1.0"
description = "Local AI video generation, sequential segment chaining, and lip-synced patch workflows"
icon = "icons/3nvizen.png"
transport = "tauri"

[engine]
type = "diffusion"
backend = "server"
server_binary = "3nvizen-ltx-sidecar"

[entitlements.launch]
min_tier = "creator_studio"
enforced_by = ["everywear_shell", "3nvizen_runtime"]
features = ["3nvizen", "3nvizen.video"]

# Model groups track the current public Lightricks/LTX-Video safetensors
# catalogue. They should map to user-facing quality ladders in Everywear rather
# than exposing raw model names in the UI.

[[model_groups]]
label = "Draft Local 540p"
min_vram_mb = 8192

  [[model_groups.models]]
  key = "ltxv-2b-0.9.8-distilled-fp8"
  role = "Primary"
  required = true
  vram_mb = 4096
  filename = "ltxv-2b-0.9.8-distilled-fp8.safetensors"
  hf_repo = "Lightricks/LTX-Video"
  hf_file = "ltxv-2b-0.9.8-distilled-fp8.safetensors"
  size_bytes = 4160000000

[[model_groups]]
label = "Standard Local 540p"
min_vram_mb = 12288

  [[model_groups.models]]
  key = "ltxv-13b-0.9.8-distilled-fp8"
  role = "Primary"
  required = true
  vram_mb = 14976
  filename = "ltxv-13b-0.9.8-distilled-fp8.safetensors"
  hf_repo = "Lightricks/LTX-Video"
  hf_file = "ltxv-13b-0.9.8-distilled-fp8.safetensors"
  size_bytes = 14620000000

[requirements]
cuda_compute = "7.0"
