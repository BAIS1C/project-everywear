# Kasai Local Applet Manifest
# Read by the Everywear OS shell to gate, provision, and launch this applet.
# Engine: llama-cpp-2 (Rust FFI to llama.cpp)
# Kasai is the agentic LLM engine: orchestrator + tool harness + RAG

[applet]
id = "kasai"
name = "Kasai"
version = "0.1.0"
description = "Local AI agent with full system access, planning, and orchestration"
icon = "kasai"
transport = "ipc"

[engine]
type = "llm"
backend = "ffi"
server_binary = ""

# Model groups: ordered by preference (first viable group wins).
# Kasai needs an orchestrator LLM (Qwen3 family).
# Higher VRAM = larger model = better reasoning.

[[model_groups]]
label = "Full Agent (9B Q8)"
min_vram_mb = 12288

  [[model_groups.models]]
  key = "qwen3-9b-agent-q8"
  role = "Primary"
  required = true
  vram_mb = 10240
  filename = "Qwen3-8B-Q8_0.gguf"
  hf_repo = "unsloth/Qwen3-8B-GGUF"
  hf_file = "Qwen3-8B-Q8_0.gguf"
  size_bytes = 8_540_000_000

[[model_groups]]
label = "Standard Agent (9B Q4)"
min_vram_mb = 8192

  [[model_groups.models]]
  key = "qwen3-9b-agent-q4km"
  role = "Primary"
  required = true
  vram_mb = 6144
  filename = "Qwen3-8B-Q4_K_M.gguf"
  hf_repo = "unsloth/Qwen3-8B-GGUF"
  hf_file = "Qwen3-8B-Q4_K_M.gguf"
  size_bytes = 5_120_000_000

[[model_groups]]
label = "Lite Agent (4B Q8)"
min_vram_mb = 4096

  [[model_groups.models]]
  key = "qwen3-4b-agent-q8"
  role = "Primary"
  required = true
  vram_mb = 3072
  filename = "Qwen3-4B-Q8_0.gguf"
  hf_repo = "unsloth/Qwen3-4B-GGUF"
  hf_file = "Qwen3-4B-Q8_0.gguf"
  size_bytes = 4_680_000_000

[requirements]
cuda_compute = "7.0"
