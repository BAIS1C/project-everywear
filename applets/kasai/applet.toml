# My Mait Applet Manifest (internal kasai runtime)
# Read by the Everywear OS shell to gate, provision, and launch this applet.
# Engine: llama-cpp-2 / llama.cpp-compatible GGUF runtime.
#
# Distribution goal:
# - My Mait Lite: one compact model that works on modest GPUs and CPU fallback.
# - My Mait Local: stronger single-model agent on 8-16 GB GPUs.
# - My Mait Local Full: larger orchestrator plus compact worker on 24 GB+ GPUs.
#
# Model groups are ordered highest-quality first. The shell walks top-down and
# selects the first group whose min_vram_mb fits the current VRAM plan.

[applet]
id = "kasai"
name = "My Mait"
version = "0.1.0"
description = "Local MAIT agent with full system access, planning, and orchestration"
icon = "kasai"
transport = "ipc"

[engine]
type = "llm"
backend = "ffi"
server_binary = ""

[[model_groups]]
label = "My Mait Ultra 32GB (Qwen3.6 35B-A3B Q4 orchestrator + Qwen3.5 9B Q8 agent)"
min_vram_mb = 32768

  [[model_groups.models]]
  key = "kasai-orchestrator-qwen3-6-35b-a3b-q4km"
  role = "Primary"
  required = true
  vram_mb = 20500
  filename = "Qwen3.6-35B-A3B-Q4_K_M.gguf"
  hf_repo = "lmstudio-community/Qwen3.6-35B-A3B-GGUF"
