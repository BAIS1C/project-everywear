# Kasai Local Applet Manifest
# Read by the Everywear OS shell to gate, provision, and launch this applet.
# Engine: llama-cpp-2 / llama.cpp-compatible GGUF runtime.
#
# Distribution goal:
# - Kasai Lite: one compact model that works on modest GPUs and CPU fallback.
# - Kasai Local: stronger single-model agent on 8-16 GB GPUs.
# - Kasai Local Full: larger orchestrator plus compact worker on 24 GB+ GPUs.
#
# Model groups are ordered highest-quality first. The shell walks top-down and
# selects the first group whose min_vram_mb fits the current VRAM plan.

[applet]
id = "kasai"
name = "Kasai"
version = "0.1.0"
description = "Local AI agent with full system access, planning, and orchestration"
icon = "kasai"
transport = "ipc"

[engine]
type = "llm"
backend = "ffi"
server_binary = ""

[[model_groups]]
label = "Kasai Local Full 24GB (30B-A3B orchestrator + 4B worker)"
min_vram_mb = 24576

  [[model_groups.models]]
  key = "kasai-orchestrator-qwen3-30b-a3b-2507-q4km"
  role = "Primary"
  required = true
  vram_mb = 19000
  filename = "Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
  hf_repo = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
