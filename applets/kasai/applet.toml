# My Mait Applet Manifest (legacy internal kasai runtime id)
# Read by the Everywear OS shell to gate, provision, and launch this applet.
# Engine: llama-cpp-2 / llama.cpp-compatible GGUF runtime.
#
# Product/runtime contract:
# - My Mait is the standalone agent hub.
# - Headless host-agent usage stays hidden behind host surfaces such as Educ8
#   Teacher Agent (entitlement loom.teacher_agent) and AI Director. Not a launcher, SKU, or chat UI.
# - "kasai" remains only the internal applet id until a deliberate rename pass.
#
# Model groups are ordered highest-quality first. The shell walks top-down and
# selects the first group whose min_vram_mb fits the current VRAM plan.

[applet]
id = "kasai"
name = "My Mait"
version = "0.1.0"
description = "Local MAIT agent with full system access, planning, and orchestration"
icon = "kasai"
transport = "ipc"

[engine]
type = "llm"
backend = "ffi"
server_binary = ""

[[model_groups]]
label = "My Mait Local 32GB (Qwen3.6 35B-A3B Q4 orchestrator + Qwen3.5 9B Q8 agent)"
min_vram_mb = 32768

  [[model_groups.models]]
